    - data:
        code: "import re\nimport json\n\n\ndef fix_sql(sql):\n\n    sql = sql.replace(\n\
          \        \"AVG(class_avg.avg_score)\",\n        \"class_avg.avg_score\"\n\
          \    )\n\n    sql = sql.replace(\n        \"AVG(grade_avg.avg_score)\",\n\
          \        \"grade_avg.avg_score\"\n    )\n\n    sql = sql.replace(\n    \
          \    \"ORDER BY s.subject\",\n        \"ORDER BY class_avg.subject\"\n \
          \   )\n\n    sql = sql.replace(\n        \"SELECT s.subject\",\n       \
          \ \"SELECT class_avg.subject\"\n    )\n\n    return sql\n\n\ndef main(input_string:str)->dict:\n\
          \n    pattern = re.search(\n        r'```json\\s*([\\s\\S]*?)\\s*```',\n\
          \        input_string\n    )\n\n    if not pattern:\n\n        raise ValueError(\n\
          \            \"输入字符串中未找到JSON\"\n        )\n\n    json_content = pattern.group(\n\
          \        1\n    ).strip()\n\n    parsed_json = json.loads(\n        json_content\n\
          \    )\n\n    for item in parsed_json:\n\n        if \"sql\" in item:\n\n\
          \            item[\"sql\"] = fix_sql(\n                item[\"sql\"]\n \
          \           )\n\n    return {\n\n        \"result\": parsed_json\n\n   \
          \ }"
